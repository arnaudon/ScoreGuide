name: Docker Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Dependabot (and fork) pull requests cannot read repository secrets —
      # dependabot has its own separate secret store — so these arrive empty and
      # the postgres image refuses to initialise:
      #   Error: Database is uninitialized and superuser password is not specified.
      # That failed this job on every dependabot PR while passing on main. The
      # job only ever needs a throwaway database, so fall back to fixed local
      # values. docker-compose.yaml has no defaults for these three (unlike
      # MCP_READONLY_PASSWORD, which defaults to `readonly`), which is why the
      # fallback belongs here.
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'postgres' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Create empty .env file
        run: |
          touch .env
      - name: Make workspace writable for the non-root container user
        # The dev override bind-mounts ./backend and ./shared; the backend
        # container now runs as uid 1000 while runner files are uid 1001,
        # and pytest writes coverage output into the mount.
        run: chmod -R a+rwX backend shared
      - name: Build and Start Containers
        run: docker compose up -d --build --wait

      - name: Run Alembic migrations
        # Catches migration regressions before deploy: the initial revision
        # creates user/score/imslp/setting and the two incrementals apply on
        # top of a fresh volume.
        run: docker compose exec -T --workdir /app/backend backend alembic upgrade head

      - name: Run Backend Tests
        # Run from /app/backend so --cov=. and .coveragerc's source = app,tests
        # match the same tree they do when we run `pytest` locally from backend/.
        run: docker compose exec -T --workdir /app/backend backend pytest

      - name: Check Container Logs (If failed)
        if: failure()
        run: docker compose logs

      - name: Stop Containers
        if: always()
        run: docker compose down
