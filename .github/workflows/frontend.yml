name: Frontend (Svelte)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-svelte/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend-svelte/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        # Also generates src/lib/paraglide/* via the paraglide vite plugin.
        run: npm run build

      - name: Unit tests (node project)
        # Fast, no browser; test.yml runs the browser project and the e2e suite.
        run: npx vitest run --project server

      - name: svelte-check
        run: npm run check

      - name: Lint
        run: npm run lint
