name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest


    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        code: ["backend", "shared"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        # apt-get update first: the runner image's preseeded package index
        # goes stale and pinned versions 404 off the mirrors.
        sudo apt-get update
        sudo apt-get install -y poppler-utils
        uv sync --frozen
    - name: Run tests
      # --directory already makes the member dir the cwd, so --project resolved
      # relative to it and looked for <member>/<member>. Newer uv errors with
      # "Project directory `backend` does not exist" instead of ignoring it, which
      # has failed every PR since. Last green run on main was 2026-05-15.
      run: uv run --frozen --directory ${{ matrix.code }} pytest
    - name: Ruff format check
      run: uv run --frozen ruff format --check ${{ matrix.code }}
    - name: Ruff lint
      run: uv run --frozen ruff check ${{ matrix.code }}
    - name: Run mypy
      run: uv run --frozen --directory ${{ matrix.code }} mypy .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-svelte/ui
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '26'
        cache: 'npm'
        cache-dependency-path: frontend-svelte/ui/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('frontend-svelte/ui/package-lock.json') }}
    - name: Install Playwright browsers
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi
    - name: Build (compiles paraglide messages, verifies prod build)
      run: npm run build
    - name: Lint (prettier)
      run: npx prettier --check .
    - name: Lint (eslint)
      run: npx eslint .
    - name: Type check
      run: npm run check
    - name: Unit tests (server + client)
      run: npx vitest --run
    - name: E2E tests
      run: npx playwright test

