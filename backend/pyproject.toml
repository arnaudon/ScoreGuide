[project]
name = "app"
version = "0.1.0"
description = "Read and play music with AI"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi[standard]>=0.119.0",
    "pydantic>=2.12.3",
    # Slim + only the extras the app uses (Google and Infomaniak's
    # OpenAI-compatible API, DuckDuckGo search, the MCP client, and logfire for
    # USE_LOGFIRE). The full `pydantic-ai` also pulls Anthropic, the CLI, evals
    # and the web UI: ~60 MB of image nobody imports.
    "pydantic-ai-slim[duckduckgo,google,logfire,mcp,openai]>=2.28.0",
    # imported directly by app/file_helper.py; was only ever present
    # transitively via pydantic-ai's bedrock extra until 2.x dropped it
    "boto3>=1.40.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "sqlmodel>=0.0.27",
    "uvicorn>=0.37.0",
    "shared",
    "pyjwt>=2.10.1",
    "pwdlib[argon2]>=0.3.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.17.2",
    "httpx>=0.28.1",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0.0",
    "pypdfium2>=4.30",
    "pypdf>=5.0",
    "pillow>=11.0",
    "numpy>=2.0",
]

[dependency-groups]
# Also listed at the workspace root for `uv sync --frozen` + `uv run` invocations.
# Repeated here so the dev image (Dockerfile.backend with INSTALL_DEV=true, set
# by docker-compose.override.yaml) has pytest for the docker-compose integration
# tests. The prod image is built without it.
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.2.0",
    "anyio>=4.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
ignore_missing_imports = true

[tool.basedpyright]
typeCheckingMode = "standard"
reportUnusedFunction = false

[tool.uv.sources]
ui = {workspace = true}
shared = {workspace = true}


[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'"
]
