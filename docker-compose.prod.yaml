# Same log cap as docker-compose.yaml, for the services only defined here
# (YAML anchors don't cross files).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    restart: always
    environment:
      # Required in prod (deploy.yaml writes it from the secret): never the
      # dev default `readonly`.
      MCP_READONLY_PASSWORD: ${MCP_READONLY_PASSWORD:?}

  mcp-postgres:
    # Same command as docker-compose.yaml, minus the dev password default.
    command:
      - "--transport=sse"
      - "--sse-host=0.0.0.0"
      - "--sse-port=8001"
      - "--access-mode=restricted"
      - "postgresql://mcp_readonly:${MCP_READONLY_PASSWORD:?}@db:5432/${POSTGRES_DB:?}"

  pgbouncer:
    # Pinned by digest to the image running in prod (PgBouncer 1.25.1, an old
    # `latest` build no tag points to any more); bump on purpose.
    image: edoburu/pgbouncer@sha256:85d1e38593617af1b5f7f285e97d407e56c29939683cc7cfe4c8f6dc19f1268b
    logging: *logging
    restart: always
    environment:
      - DB_HOST=db
      # No defaults on purpose: a partially-populated .env should fail
      # loudly instead of silently falling back to postgres/postgres.
      - DB_USER=${POSTGRES_USER:?}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?}
      - DB_NAME=${POSTGRES_DB:?}
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
    depends_on:
      - db

  pgadmin:
    # Pinned by digest to the image running in prod (tag 9.13); bump on purpose.
    image: dpage/pgadmin4@sha256:d243a4bcc02d2ee6b447c601692813531d2d0fbca18b583d9f7f9658da835d81
    logging: *logging
    restart: always
    environment:
      # Set both in .env (deploy.yaml writes them from GitHub secrets).
      # No password default: pgadmin must not come up with admin/admin.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@scoreguide.ch}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?}
    depends_on:
      - db

  db-backup:
    # schickling/postgres-backup-s3 bundles pg_dump 14.2, which refuses to dump
    # a PG16 server (version mismatch). eeshugerman/postgres-backup-s3 is the
    # maintained fork and tags images to match the server major version.
    image: eeshugerman/postgres-backup-s3:16
    logging: *logging
    restart: always
    # This image expects POSTGRES_DATABASE / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY,
    # but .env (written by .github/workflows/deploy.yaml) provides POSTGRES_DB /
    # S3_ACCESS_KEY / S3_SECRET_KEY, and never sets POSTGRES_HOST. env_file alone left
    # them at the image's "**None**" defaults, so every scheduled run failed silently.
    # Map them explicitly — no new secrets needed.
    environment:
      - SCHEDULE=@daily
      - S3_PREFIX=database-backups
      - S3_ENDPOINT=https://${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DATABASE=${POSTGRES_DB:-postgres}
      # GPG-encrypt each dump (required: dumps go to S3) and delete dumps older
      # than this many days (empty: keep forever). Set by the deploy workflow.
      - PASSPHRASE=${BACKUP_PASSPHRASE:?}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-}
    depends_on:
      - db

  caddy:
    image: caddy:2-alpine
    logging: *logging
    restart: always
    ports:
      - "80:80"
      - "443:443"
      # Loopback only: the backend and pgadmin are plain-HTTP admin/debug
      # surfaces — reach them through an SSH tunnel, not the public internet.
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5050:5050"
    volumes:
      # Mount the folder, not the file: git replaces Caddyfile on pull, and a
      # single-file bind mount keeps showing the old copy until a restart.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - pgadmin
    networks:
      - default
      - web

  backend:
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@pgbouncer:5432/${POSTGRES_DB:?}
    depends_on:
      - pgbouncer

  frontend:
    restart: always
    environment:
      # The public origin, for SvelteKit's CSRF check on form POSTs and for
      # absolute URLs. Without it adapter-node rebuilds it from the Host header
      # Caddy forwards (and assumes https).
      - ORIGIN=https://scoreguide.ch
      - BACKEND_URL=http://backend:8000
      - PUBLIC_BACKEND_URL=http://backend:8000
      # Largest request the web server accepts: a MAX_PDF_MB (50) upload plus
      # form overhead. Unlimited let anyone stream gigabytes into memory/disk.
      - BODY_SIZE_LIMIT=60M
      # Behind Caddy, the visitor's IP is the X-Forwarded-For entry Caddy
      # appended (it ignores client-sent values). Forwarded to the backend
      # so rate limits apply per visitor, not to everyone at once.
      - ADDRESS_HEADER=X-Forwarded-For
      - XFF_DEPTH=1


networks:
  web:
    external: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
