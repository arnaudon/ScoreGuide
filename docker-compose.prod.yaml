services:
  db:
    restart: always

  pgbouncer:
    image: edoburu/pgbouncer
    restart: always
    environment:
      - DB_HOST=db
      # No defaults on purpose: a partially-populated .env should fail
      # loudly instead of silently falling back to postgres/postgres.
      - DB_USER=${POSTGRES_USER:?}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?}
      - DB_NAME=${POSTGRES_DB:?}
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
    depends_on:
      - db

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      # Set both in .env (deploy.yaml writes them from GitHub secrets).
      # No password default: pgadmin must not come up with admin/admin.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@scoreguide.ch}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?}
    depends_on:
      - db

  db-backup:
    # schickling/postgres-backup-s3 bundles pg_dump 14.2, which refuses to dump
    # a PG16 server (version mismatch). eeshugerman/postgres-backup-s3 is the
    # maintained fork and tags images to match the server major version.
    image: eeshugerman/postgres-backup-s3:16
    restart: always
    # This image expects POSTGRES_DATABASE / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY,
    # but .env (written by .github/workflows/deploy.yaml) provides POSTGRES_DB /
    # S3_ACCESS_KEY / S3_SECRET_KEY, and never sets POSTGRES_HOST. env_file alone left
    # them at the image's "**None**" defaults, so every scheduled run failed silently.
    # Map them explicitly — no new secrets needed.
    environment:
      - SCHEDULE=@daily
      - S3_PREFIX=database-backups
      - S3_ENDPOINT=https://${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DATABASE=${POSTGRES_DB:-postgres}
    env_file: .env
    depends_on:
      - db

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      # Loopback only: the backend and pgadmin are plain-HTTP admin/debug
      # surfaces — reach them through an SSH tunnel, not the public internet.
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5050:5050"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - pgadmin
    networks:
      - default
      - web

  backend:
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@pgbouncer:5432/${POSTGRES_DB:?}
    depends_on:
      - pgbouncer

  frontend:
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
      - PUBLIC_BACKEND_URL=http://backend:8000
      - BODY_SIZE_LIMIT=Infinity
    env_file: .env


networks:
  web:
    external: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
